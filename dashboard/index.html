<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parafomo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1311" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parafomo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="ust" id="ust" hidden>
  <div class="marka"><img src="/logo.png" alt="" width="21" height="21"><span id="baslik">Özet</span></div>
  <button class="ikon-btn" id="yenile" type="button" aria-label="Yenile">
    <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</header>

<main id="ekran" class="ekran"><p class="yukleniyor">Yükleniyor…</p></main>

<nav class="sekmeler" id="sekmeler" hidden>
  <button type="button" data-sekme="ozet" aria-label="Özet">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
    <span>Özet</span>
  </button>
  <button type="button" data-sekme="icerik" aria-label="İçerik">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9v6l5-3z" fill="currentColor"/></svg>
    <span>İçerik</span>
  </button>
  <button type="button" data-sekme="web" aria-label="Web">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9s1.3-6.3 3.8-9z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <span>Web</span>
  </button>
  <button type="button" data-sekme="gorevler" aria-label="Görevler">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 9l2 2 4-4M8 16h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Görevler</span>
    <i class="nokta" id="gorevNokta" hidden></i>
  </button>
  <button type="button" data-sekme="kontrol" aria-label="Kontrol">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <span>Kontrol</span>
  </button>
</nav>

<div class="perde" id="perde" hidden>
  <div class="perde-bg" data-kapat></div>
  <div class="perde-kart" role="dialog" aria-modal="true" aria-label="Ayrıntı">
    <button class="perde-x" type="button" data-kapat aria-label="Kapat">×</button>
    <div id="perdeIc"></div>
  </div>
</div>
<div class="bildirim" id="bildirim" role="status" aria-live="polite"></div>
</body>
</html>
