# /etc/caddy/Caddyfile içine eklenecek blok — api.parafomo.com
# DNS: api.parafomo.com A → 91.107.202.64 (Cloudflare'de DNS-only / gri bulut,
# ki Caddy Let's Encrypt HTTP-01 doğrulamasını doğrudan yapabilsin).
# Ekledikten sonra: caddy validate --config /etc/caddy/Caddyfile && sudo systemctl reload caddy

api.parafomo.com {
    encode gzip
    # Dış sınır: en büyük meşru gövde ham e-posta (/inbox/ingest, worker 5 MB üstünü reddeder);
    # diğer uçlar küçük JSON. Sınırsız gövde uvicorn'da belleğe okunuyordu.
    request_body {
        max_size 8MB
    }
    header {
        Strict-Transport-Security "max-age=31536000"
        -Server
    }
    # ? = uygulama zaten yolladıysa dokunma, yoksa ekle. Her ? AYRI satırda (bloktaki ?'ler ortak koşula bağlanır).
    header ?X-Content-Type-Options nosniff
    header ?X-Frame-Options DENY
    reverse_proxy 127.0.0.1:8000
}
