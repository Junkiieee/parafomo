# /etc/caddy/Caddyfile — app.parafomo.com (statik PWA: scripts/deploy-app.sh → /srv/parafomo-app)
# BAŞVURU ŞABLONU (2026-11-03): sunucudaki mevcut app.parafomo.com bloğu repoda yoktu. Mevcut bloğu silmeden,
# aşağıdaki header satırlarını ona ekle; root/file_server satırları zaten varsa tekrar ekleme.
# Ekledikten sonra: caddy validate --config /etc/caddy/Caddyfile && sudo systemctl reload caddy
#
# Neden: Caddy Cache-Control göndermediği için tarayıcı HTML/JS/CSS'i sezgisel olarak "taze" sayıp yayından sonra
# saatlerce eski sürümü gösteriyordu (yeni sw.js pf-v4 bunu kendi tarafında çözüyor; bu başlık ilk ziyareti ve
# service worker'sız tarayıcıları da kapsar). "no-cache" = her açılışta sunucuya sor, değişmediyse 304 (ucuz).
app.parafomo.com {
    root * /srv/parafomo-app
    encode zstd gzip
    file_server

    header {
        Strict-Transport-Security "max-age=31536000"
        X-Content-Type-Options "nosniff"
        Referrer-Policy "strict-origin-when-cross-origin"
        -Server
    }
    # Sayfalar, uygulama kodu, veri ve service worker: her seferinde doğrulat
    @taze path */ *.html *.js *.css *.json *.webmanifest
    header @taze Cache-Control "no-cache"
    # İkonlar nadiren değişir
    @ikon path *.png *.svg *.ico
    header @ikon Cache-Control "public, max-age=604800"
}
