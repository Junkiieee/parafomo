# /etc/caddy/Caddyfile içine eklenecek blok — dashboard.parafomo.com (yalnız Kaan)
# DNS: dashboard.parafomo.com A → 91.107.202.64 (Cloudflare DNS-only / gri bulut)
# Panel v2 (2026-11-16): giriş uygulamanın kendisinde (dashboard/server.py: şifre /root/.config/parafomo/dashboard.env,
# 180 günlük HttpOnly oturum çerezi) → telefonda ana ekrana eklenen uygulama (PWA) her açılışta şifre sormaz.
# Servis: cp deploy/parafomo-dashboard.service /etc/systemd/system/ && systemctl enable --now parafomo-dashboard
# Değiştirince: caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy
# nosniff, CSP (index) ve /api/ için no-store'u panel (server.py) kendisi yollar.
dashboard.parafomo.com {
    encode zstd gzip
    # En büyük meşru istek: "Bana yaz" + görsel (≤1600 px JPEG, base64 JSON; sunucu sınırı 12 M karakter).
    # Dev gövde panel sürecinin belleğine okunmadan 413 alsın.
    request_body {
        max_size 16MB
    }
    header {
        X-Robots-Tag "noindex, nofollow"
        X-Frame-Options DENY
        Referrer-Policy no-referrer
        Strict-Transport-Security "max-age=31536000"
        -Server
    }
    reverse_proxy 127.0.0.1:8792
}
