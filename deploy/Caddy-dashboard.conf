# /etc/caddy/Caddyfile içine eklenecek blok — dashboard.parafomo.com (yalnız Kaan)
# DNS: dashboard.parafomo.com A → 91.107.202.64 (Cloudflare DNS-only / gri bulut)
# Şifre: /root/.config/parafomo/dashboard.env (repo DIŞI). Hash üret: caddy hash-password --plaintext '<şifre>'
# Servis: cp deploy/parafomo-dashboard.service /etc/systemd/system/ && systemctl enable --now parafomo-dashboard
# Değiştirince: caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy
dashboard.parafomo.com {
    encode zstd gzip
    # En büyük meşru istek bir not/istek metni (≤10 bin karakter); dev gövde belleğe okunmadan 413
    request_body {
        max_size 1MB
    }
    basic_auth {
        kaan <BCRYPT_HASH>
    }
    header {
        X-Robots-Tag "noindex, nofollow"
        X-Frame-Options DENY
        Referrer-Policy no-referrer
        Strict-Transport-Security "max-age=31536000"
        -Server
    }
    # Panel (server.py) bunları kendisi yollar; ? = yalnız yanıtta yoksa ekle (ör. Caddy'nin kendi 401'i).
    # Her ? AYRI satırda: aynı bloktaki ?'ler ortak koşula bağlanır, biri varsa diğeri de yazılmaz.
    header ?X-Content-Type-Options nosniff
    header ?Content-Security-Policy "frame-ancestors 'none'"
    reverse_proxy 127.0.0.1:8792 {
        # Parola Caddy'de doğrulandı; düz metin Basic kimliği panel sürecine taşınmasın
        header_up -Authorization
    }
}
