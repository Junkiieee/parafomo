# ÖNERİ — KURULU DEĞİL (2026-11-18, denetim backend-10). parafomo-api için systemd sertleştirme drop-in'i.
#
# Neden: internete açık API (Caddy → uvicorn) root olarak, hiç kum havuzu olmadan çalışıyor
# (`systemd-analyze security parafomo-api` → 9.6 UNSAFE). Uygulamada bir kod çalıştırma açığı tüm sunucuyu,
# /root/.config/parafomo'daki sırları ve repo push yetkisini verirdi. Bu blokla süreç yine root kalır ama:
# yalnız /root/parafomo-data'ya yazabilir (portfolio.db + journal/WAL, gelen kutusu .eml'leri), repo/venv/etc
# salt-okunur, sır dizinlerini hiç göremez, root yetkileri (capability) bırakılır.
#
# API'nin dokunduğu yerler (kontrol edildi): backend/.env + data/benchmarks.json (okuma), /root/parafomo-data
# (yazma), dış ağ (Google tokeninfo, Yahoo, Truncgil, CoinGecko, Google News, Brevo SMTP), journald.
# Cron betikleri (portfolio-snapshot/alerts/monthly, newsletter, zam alarmı) bu birimin DIŞINDA çalışır, etkilenmez.
#
# Kurulum (Kaan / sunucu oturumu; önce yedek: bash scripts/backup.sh):
#   sudo mkdir -p /etc/systemd/system/parafomo-api.service.d
#   sudo cp /root/parafomo/deploy/parafomo-api.override.conf /etc/systemd/system/parafomo-api.service.d/hardening.conf
#   sudo systemctl daemon-reload && sudo systemctl restart parafomo-api
# Doğrula:
#   systemctl is-active parafomo-api                         # active
#   curl -s http://127.0.0.1:8000/health                     # {"status":"ok"}
#   curl -s "http://127.0.0.1:8000/public/price?asset_type=gold"   # fiyat (dış ağ çalışıyor)
#   journalctl -u parafomo-api -n 30 --no-pager              # "Read-only file system" / "Permission denied" yok
#   uygulamada giriş + pozisyon ekle (DB yazımı) · systemd-analyze security parafomo-api (puan düşmeli)
# Geri alma: sudo rm /etc/systemd/system/parafomo-api.service.d/hardening.conf && sudo systemctl daemon-reload \
#            && sudo systemctl restart parafomo-api
# Sonraki adım (daha büyük iş): ayrı kullanıcı (User=parafomo-api) + veri dizini sahipliği.

[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=-/root/parafomo-data
InaccessiblePaths=-/root/.config/parafomo -/root/.ssh -/root/.gnupg -/root/parafomo/.env -/root/parafomo/.git
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityBoundingSet=
UMask=0077
